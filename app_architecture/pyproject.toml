[project]
name = "perf-monitor"
version = "0.2.0"
description = "Long-term managed brokerage account performance monitor and benchmark validation scaffold."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
perf-monitor = "perf_monitor.interfaces.cli:main"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
